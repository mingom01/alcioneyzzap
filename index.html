<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화학 합성 퍼즐</title>
<style>
  :root{
    --bg:#eceef1; --panel:#ffffff; --panel2:#f4f5f7; --line:#dcdfe4;
    --text:#1b1d21; --dim:#8b9199; --accent:#2f9e5f; --gold:#2f9e5f;
    --gas:#4a9fb8; --liquid:#4a72c4; --solid:#a9762f;
    --ink:#1b1d21; --cell:74px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:-.2px}
  header h1 span{color:var(--dim);font-weight:500}
  .stat{
    background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    padding:4px 10px; font-size:10px; color:var(--dim); line-height:1.25; text-align:right;
  }
  .stat b{display:block;font-size:14px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  .stat b.gold{color:var(--accent)}
  .stat b.warn{color:#d2503c}
  .sp{flex:1}
  button{
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:6px 11px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  button:hover:not(:disabled){background:var(--panel2);border-color:#c3c8d0}
  button:disabled{opacity:.38;cursor:default}

  #app{flex:1;display:flex;gap:12px;padding:12px;min-height:0;justify-content:center}
  .col{display:flex;flex-direction:column;gap:10px;min-height:0}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .pane h2{font-size:10px;color:var(--dim);letter-spacing:.6px;margin:0 0 8px;font-weight:600}
  #left{width:216px;flex:none}
  #right{width:268px;flex:none;min-height:0}
  #right .pane{display:flex;flex-direction:column;min-height:0;flex:1}

  /* 목표 — 초록 뱃지 */
  .goalName{
    display:inline-flex; align-items:baseline; gap:6px;
    background:#e8f5ec; border:1px solid #bfe3cd; color:#1f7a49;
    border-radius:6px; padding:4px 9px; font-size:13px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .goalName small{font-size:10px;font-weight:600;color:#4f9b73}
  .goalSub{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.65}
  .gbar{height:4px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;margin-top:9px;overflow:hidden}
  .gbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s}

  /* 보드 */
  #boardWrap{display:flex;flex-direction:column;align-items:center;gap:9px;flex:none}
  #board{
    display:grid; gap:1px; padding:1px; position:relative;
    background:var(--line); border:1px solid var(--line); border-radius:4px;
  }
  .cell{width:var(--cell);height:var(--cell);background:var(--panel)}
  #tiles{position:absolute;inset:0;pointer-events:none}
  .tok{
    position:absolute; width:var(--cell); height:var(--cell);
    background:var(--panel); border:1px solid transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer; user-select:none; pointer-events:auto;
    transition:left .5s cubic-bezier(.33,.85,.3,1), top .5s cubic-bezier(.33,.85,.3,1),
               opacity .35s, background .15s, box-shadow .15s;
  }
  .tok.mol{background:#f1f3f6}                       /* 합성된 분자는 옅은 회색 바탕 */
  .tok .f{font-size:19px;font-weight:600;color:var(--ink);line-height:1.05;text-align:center;letter-spacing:-.3px}
  .tok.mol .f{font-size:15px}
  .tok .n{font-size:8.5px;color:var(--dim);line-height:1;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tok .ph{position:absolute;left:6px;top:6px;width:4px;height:4px;border-radius:50%;background:var(--phase);opacity:.75}
  .tok.gone{opacity:0;transform:scale(.8);transition:opacity .4s, transform .4s}
  @keyframes popin{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
  .tok.popin{animation:popin .35s}
  .tok.anchor{background:#e7edf7;box-shadow:inset 0 0 0 2px var(--ink)}
  .tok.path{box-shadow:inset 0 0 0 1px #b9c2cf}
  @keyframes glow{0%,100%{box-shadow:inset 0 0 0 2px #7fc79c}50%{box-shadow:inset 0 0 0 2px var(--accent)}}
  .tok.cand{background:#eaf6ee;animation:glow 1.3s infinite;z-index:3}
  .tok.dim{opacity:.55}
  @keyframes fire{0%{background:#fdf3d6}100%{background:var(--panel)}}
  .tok.react{animation:fire .45s;box-shadow:inset 0 0 0 2px #e0b656}
  @keyframes bond{0%,100%{box-shadow:inset 0 0 0 2px #7fc79c}50%{box-shadow:inset 0 0 0 3px var(--accent)}}
  .tok.bond{animation:bond .5s 2;background:#eaf6ee;z-index:2}
  .legend{display:flex;gap:15px;font-size:10.5px;color:var(--dim)}
  .legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}

  #float{
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
    font-size:24px; font-weight:800; color:var(--ink); pointer-events:none; opacity:0;
    z-index:9; white-space:nowrap; text-align:center; line-height:1.35;
    text-shadow:0 2px 10px #fff, 0 0 22px #fff, 0 0 30px #fff;
  }
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-42%)}22%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-88%)}}
  #float.on{animation:floatUp 1.1s}

  #log{overflow-y:auto;display:flex;flex-direction:column;flex:1;min-height:0}
  .lg{padding:8px 2px;border-bottom:1px solid var(--line)}
  .lg:last-child{border-bottom:0}
  .lg .eq{font-size:12px;font-weight:600;color:var(--ink)}
  .lg .mt{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.45}
  .lg.win .mt{color:#1f7a49}

  .modal{position:fixed;inset:0;background:rgba(30,34,40,.42);display:none;align-items:center;justify-content:center;padding:24px;z-index:60}
  .modal.on{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(860px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(20,25,35,.18)}
  .sheet .hd{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .sheet .hd h2{margin:0;font-size:15px}
  .sheet .bd{overflow-y:auto;padding:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:7px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .card .t{font-weight:700;font-size:13px;color:var(--ink)}
  .card .t i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--phase);margin-right:6px;vertical-align:middle}
  .card .d{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
  .card.lock{background:var(--panel2);border-style:dashed}
  .card.lock .t{color:#c2c7ce}
  .center{text-align:center;padding:22px}
  .center h3{font-size:20px;margin:0 0 8px}
  .center p{color:var(--dim);font-size:13px;line-height:1.75;margin:0 0 16px}
  .big{font-size:34px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .unlock{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 12px;margin:4px 3px}
  .unlock .f{font-size:17px;font-weight:700;color:var(--ink)}
  kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>

<header>
  <h1>화학 합성 <span>퍼즐</span></h1>
  <div class="stat">점수<b id="score">0</b></div>
  <div class="stat">최고<b id="best" class="gold">0</b></div>
  <div class="stat">스테이지<b id="stageNo">1</b></div>
  <div class="stat">남은 반응<b id="moves">0</b></div>
  <div class="sp"></div>
  <button id="btnUndo" disabled>되돌리기</button>
  <button id="btnCodex">도감</button>
  <button id="btnHelp">도움말</button>
  <button id="btnRestart">다시 시작</button>
</header>

<div id="app">
  <div class="col" id="left">
    <div class="pane">
      <h2>스테이지 목표</h2>
      <div class="goalName" id="goalName">—</div>
      <div class="goalSub" id="goalSub"></div>
      <div class="gbar"><i id="goalBar"></i></div>
    </div>
    <div class="pane">
      <h2>선택한 칸</h2>
      <div id="selInfo" style="font-size:12px;color:var(--dim);line-height:1.7">
        칸을 누르면 기준점이 되고,<br>거기서부터 이어서 누를 수 있는<br>칸이 금색으로 빛납니다.
      </div>
    </div>
  </div>

  <div id="boardWrap">
    <div id="board"><div id="float"></div></div>
    <div class="legend">
      <span><i style="background:var(--gas)"></i>기체 · 제자리</span>
      <span><i style="background:var(--liquid)"></i>액체</span>
      <span><i style="background:var(--solid)"></i>고체 · 분자 위에 쌓임</span>
    </div>
  </div>

  <div class="col" id="right">
    <div class="pane">
      <h2>합성 기록</h2>
      <div id="log"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet">
  <div class="hd"><h2 id="mTitle">도감</h2><div class="sp"></div><button id="mClose">닫기</button></div>
  <div class="bd" id="mBody"></div>
</div></div>

<script>
/* ============================================================
   물질 사전 — comp: 원자 구성 · p: 상 · el: 원소
   한 줄로 이어 누른 칸들의 원자를 모두 더한 구성이
   아래 사전의 어떤 물질과 정확히 같으면 그 물질이 합성된다.
   ============================================================ */
const C = {
  /* ---- 원소 ---- */
  H :{n:'수소',    f:'H',  p:'gas',   el:1, w:4, comp:{H:1},  d:'가장 가벼운 원소. 우주 질량의 약 75%.'},
  O :{n:'산소',    f:'O',  p:'gas',   el:1, w:4, comp:{O:1},  d:'호흡과 연소에 반드시 필요한 원소.'},
  C :{n:'탄소',    f:'C',  p:'solid', el:1, w:3, comp:{C:1},  d:'모든 유기물의 뼈대가 되는 원소.'},
  N :{n:'질소',    f:'N',  p:'gas',   el:1, w:3, comp:{N:1},  d:'공기의 78%를 차지하는 원소.'},
  S :{n:'황',      f:'S',  p:'solid', el:1, w:2, comp:{S:1},  d:'노란 고체. 화산 근처에서 발견된다.'},
  Na:{n:'나트륨',  f:'Na', p:'solid', el:1, w:2, comp:{Na:1}, d:'물에 닿으면 격렬히 반응하는 알칼리 금속.'},
  Cl:{n:'염소',    f:'Cl', p:'gas',   el:1, w:2, comp:{Cl:1}, d:'황록색의 반응성이 큰 할로젠 원소.'},
  Ca:{n:'칼슘',    f:'Ca', p:'solid', el:1, w:2, comp:{Ca:1}, d:'뼈와 석회암을 이루는 금속 원소.'},
  Mg:{n:'마그네슘',f:'Mg', p:'solid', el:1, w:2, comp:{Mg:1}, d:'눈부신 흰빛을 내며 타는 가벼운 금속.'},
  Fe:{n:'철',      f:'Fe', p:'solid', el:1, w:2, comp:{Fe:1}, d:'문명을 만든 금속. 지구 핵의 주성분.'},
  K :{n:'칼륨',    f:'K',  p:'solid', el:1, w:2, comp:{K:1},  d:'보라색 불꽃을 내는 알칼리 금속.'},
  Cu:{n:'구리',    f:'Cu', p:'solid', el:1, w:2, comp:{Cu:1}, d:'전기를 가장 잘 나르는 실용 금속.'},

  /* ---- 기체 ---- */
  H2 :{n:'수소',      f:'H₂',   p:'gas', comp:{H:2},      d:'가장 가벼운 분자. 연료전지의 연료.'},
  O2 :{n:'산소',      f:'O₂',   p:'gas', comp:{O:2},      d:'대기의 21%를 차지하며 연소를 돕는다.'},
  N2 :{n:'질소',      f:'N₂',   p:'gas', comp:{N:2},      d:'삼중결합이 강해 좀처럼 반응하지 않는다.'},
  Cl2:{n:'염소',      f:'Cl₂',  p:'gas', comp:{Cl:2},     d:'수돗물 소독에 쓰이지만 독성이 강하다.'},
  O3 :{n:'오존',      f:'O₃',   p:'gas', comp:{O:3},      d:'자외선을 막아주는 오존층의 주인공.'},
  CO :{n:'일산화탄소', f:'CO',   p:'gas', comp:{C:1,O:1},  d:'불완전 연소로 생기는 무색무취의 독가스.'},
  CO2:{n:'이산화탄소', f:'CO₂',  p:'gas', comp:{C:1,O:2},  d:'호흡과 연소의 산물이자 대표적 온실기체.'},
  CH4:{n:'메테인',    f:'CH₄',  p:'gas', comp:{C:1,H:4},  d:'천연가스의 주성분. 가장 단순한 탄화수소.'},
  C2H2:{n:'아세틸렌', f:'C₂H₂', p:'gas', comp:{C:2,H:2},  d:'용접 불꽃을 만드는 삼중결합 탄화수소.'},
  C2H4:{n:'에틸렌',   f:'C₂H₄', p:'gas', comp:{C:2,H:4},  d:'과일을 익히는 식물 호르몬이자 플라스틱 원료.'},
  C2H6:{n:'에테인',   f:'C₂H₆', p:'gas', comp:{C:2,H:6},  d:'천연가스에 섞여 있는 탄화수소.'},
  C3H8:{n:'프로페인', f:'C₃H₈', p:'gas', comp:{C:3,H:8},  d:'부탄가스와 함께 쓰이는 액화석유가스.'},
  C4H10:{n:'뷰테인',  f:'C₄H₁₀',p:'gas', comp:{C:4,H:10}, d:'라이터와 휴대용 버너의 연료.'},
  NH3:{n:'암모니아',  f:'NH₃',  p:'gas', comp:{N:1,H:3},  d:'하버-보슈법으로 대량 생산되어 세계를 먹여 살린다.'},
  NO :{n:'일산화질소',f:'NO',   p:'gas', comp:{N:1,O:1},  d:'번개가 칠 때 공기 중에서 만들어진다.'},
  NO2:{n:'이산화질소',f:'NO₂',  p:'gas', comp:{N:1,O:2},  d:'적갈색의 대기오염 물질.'},
  N2O:{n:'아산화질소',f:'N₂O',  p:'gas', comp:{N:2,O:1},  d:'웃음 가스. 최초의 흡입 마취제.'},
  N2O4:{n:'사산화이질소',f:'N₂O₄',p:'gas',comp:{N:2,O:4}, d:'로켓 추진제의 산화제.'},
  CH3NH2:{n:'메틸아민',f:'CH₃NH₂',p:'gas',comp:{C:1,H:5,N:1}, d:'생선 비린내의 정체. 가장 단순한 아민.'},
  HCl:{n:'염화수소',  f:'HCl',  p:'gas', comp:{H:1,Cl:1}, d:'물에 녹으면 염산. 위액의 성분이기도 하다.'},
  H2S:{n:'황화수소',  f:'H₂S',  p:'gas', comp:{H:2,S:1},  d:'썩은 달걀 냄새의 독성 기체.'},
  SO2:{n:'이산화황',  f:'SO₂',  p:'gas', comp:{S:1,O:2},  d:'산성비의 원인이 되는 자극성 기체.'},
  HCN:{n:'시안화수소',f:'HCN',  p:'gas', comp:{H:1,C:1,N:1}, d:'아몬드 향이 나는 맹독.'},

  /* ---- 액체 ---- */
  H2O :{n:'물',        f:'H₂O',    p:'liquid', comp:{H:2,O:1},     d:'생명의 용매. 지구 표면의 70%를 덮고 있다.'},
  H2O2:{n:'과산화수소', f:'H₂O₂',   p:'liquid', comp:{H:2,O:2},     d:'소독약(옥시풀)의 성분. 서서히 분해된다.'},
  N2H4:{n:'하이드라진', f:'N₂H₄',   p:'liquid', comp:{N:2,H:4},     d:'인공위성 자세제어에 쓰이는 로켓 연료.'},
  HNO2:{n:'아질산',     f:'HNO₂',   p:'liquid', comp:{H:1,N:1,O:2}, d:'불안정한 약산. 육류 발색제의 원료.'},
  HNO3:{n:'질산',       f:'HNO₃',   p:'liquid', comp:{H:1,N:1,O:3}, d:'비료와 폭약을 만드는 강산.'},
  SO3 :{n:'삼산화황',   f:'SO₃',    p:'liquid', comp:{S:1,O:3},     d:'황산 제조의 핵심 중간체.'},
  H2SO4:{n:'황산',      f:'H₂SO₄',  p:'liquid', comp:{H:2,S:1,O:4}, d:'‘산업의 피’. 생산량이 국력의 지표로 쓰였다.'},
  H2CO3:{n:'탄산',      f:'H₂CO₃',  p:'liquid', comp:{H:2,C:1,O:3}, d:'탄산음료의 톡 쏘는 맛. 쉽게 분해된다.'},
  CH2O:{n:'폼알데하이드',f:'CH₂O',  p:'liquid', comp:{C:1,H:2,O:1}, d:'표본을 보존하는 방부제. 포도당의 씨앗.'},
  HCOOH:{n:'폼산',      f:'HCOOH',  p:'liquid', comp:{C:1,H:2,O:2}, d:'개미가 쏘는 산. 가장 단순한 카복실산.'},
  CH3OH:{n:'메탄올',    f:'CH₃OH',  p:'liquid', comp:{C:1,H:4,O:1}, d:'가장 단순한 알코올. 마시면 실명한다.'},
  CH3CHO:{n:'아세트알데하이드',f:'CH₃CHO',p:'liquid',comp:{C:2,H:4,O:1}, d:'숙취의 주범. 술이 분해되며 생긴다.'},
  CH3COOH:{n:'아세트산',f:'CH₃COOH',p:'liquid',comp:{C:2,H:4,O:2},  d:'식초의 신맛. 에탄올이 산화되면 만들어진다.'},

/* 판을 깔 때 같은 물질이 줄줄이 늘어선 곳을 흩어 준다.
   시작 판은 상과 무관하게 섞여 있으므로 어느 칸끼리든 맞바꾼다.
   일부러 일부는 남겨 둬서 붙어 있는 자리도 몇 군데 생긴다.            */
function deClump(){
  const same = (r,c,id) => {
    let n=0;
    for(const [dr,dc] of DIRS){
      const nr=r+dr, nc=c+dc;
      if(nr<0||nc<0||nr>=N||nc>=N) continue;
      if(grid[nr][nc]===id) n++;
    }
    return n;
  };
  for(let pass=0; pass<4; pass++){
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const id=grid[r][c]; if(!id) continue;
      if(same(r,c,id) < 2) continue;              // 두 칸 이상 붙어 있을 때만 손본다
      if(Math.random() < 0.3) continue;           // 30%는 그대로 둔다
      const opts=[];
      for(let rr=0;rr<N;rr++) for(let cc=0;cc<N;cc++){
        const o=grid[rr][cc];
        if(!o || o===id) continue;
        opts.push([rr,cc]);
      }
      if(!opts.length) continue;
      const [rr,cc]=opts[Math.floor(Math.random()*opts.length)];
      const other=grid[rr][cc];
      const before = same(r,c,id) + same(rr,cc,other);
      grid[r][c]=other; grid[rr][cc]=id;
      const t=uids[r][c]; uids[r][c]=uids[rr][cc]; uids[rr][cc]=t;
      if(same(r,c,other) + same(rr,cc,id) >= before){   // 나아지지 않으면 되돌린다
        grid[r][c]=id; grid[rr][cc]=other;
        const t2=uids[r][c]; uids[r][c]=uids[rr][cc]; uids[rr][cc]=t2;
      }
    }
  }
}
/* 스테이지가 올라갈수록 분자가 몇 개 깔린 채로 시작한다 */
function seedMolecules(n){
  if(!n) return;
  const big = STAGES[stage].big;
  const cand = Object.keys(C).filter(id=> !C[id].el
      && Object.keys(C[id].comp).every(e=>pool.includes(e))
      && atoms(id)>=2 && atoms(id)<=big);
  if(!cand.length) return;
  const spots=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) spots.push([r,c]);
  for(let i=spots.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
  for(let i=0;i<n && i<spots.length;i++){
    const [r,c]=spots[i];
    put(r,c, cand[Math.floor(Math.random()*cand.length)]);
  }
}
/* 새 원소 뽑기 — 판에 이미 흔한 원소는 덜 나오게 한다.
   (그냥 무작위로 두면 기체는 계속 소모되고 탄소 같은 고체만 바닥에 쌓인다) */
const sumW = () => pool.reduce((a,id)=>a+C[id].w, 0);
function randEl(){
  const cnt={}; pool.forEach(id=>cnt[id]=0);
  let cells=0, lower=0;
  if(grid) for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const id=grid[r][c]; if(!id) continue;
    cells++;
    if(C[id].p!=='gas') lower++;
    if(id in cnt) cnt[id]++;
  }
  const total = sumW(), bag=[];
  pool.forEach(id=>{
    const target = C[id].w/total;                  // 원래 나와야 할 비율
    const share  = cells ? cnt[id]/cells : target; // 지금 판에 깔린 비율
    let w = C[id].w;
    if(share > target) w *= Math.max(0.08, 1 - (share-target)/target);   // 흔하면 억제
    if(share > 0.28) w *= 0.1;                                           // 한 원소가 판의 28%를 넘으면 강하게 억제
    if(C[id].p!=='gas' && cells && lower/cells > 0.45) w *= 0.35;        // 고체·액체가 판의 절반 가까이 차면 억제
    const n = Math.max(1, Math.round(w*12));
    for(let i=0;i<n;i++) bag.push(id);
  });
  return bag[Math.floor(Math.random()*bag.length)];
}
/* 놓을 자리를 보고 뽑기 — 같은 원소가 줄줄이 붙는 것을 줄인다.
   다만 네 번에 한 번은 그냥 무작위로 둬서 몇 개는 붙어 있게 남긴다. */
function pickFor(r, c){
  if(Math.random() < 0.25) return randEl();
  let bestId=null, bestScore=99;
  for(let i=0;i<5;i++){
    const id = randEl();
    let s=0;
    for(const [dr,dc] of DIRS){
      const nr=r+dr, nc=c+dc;
      if(nr<0||nc<0||nr>=N||nc>=N) continue;
      if(grid[nr][nc]===id) s++;
    }
    if(s<bestScore){ bestScore=s; bestId=id; if(!s) break; }
  }
  return bestId;
}

/* ============ 침강 — 내가 만든 것만 움직인다 ============
   · 기체를 만들면 그 자리에 그대로 있는다
   · 액체·고체를 만들면 아래로 가라앉는다. 낱개 원소는 그냥 지나쳐 내려가고,
     이미 가라앉아 있는 화합물을 만나면 그 위에 얹혀 쌓인다
   · 지나친 칸들만 한 칸씩 밀리고, 나머지 판은 그대로다
   (처음 깔린 원소들은 상과 무관하게 섞여 있어도 된다)                */
function sink(uid){
  const pos = findUid(uid);
  if(!pos) return null;
  const [r,c] = pos;
  if(C[grid[r][c]].p === 'gas') return pos;          // 기체는 움직이지 않는다
  let dest = r;
  while(dest+1 < N){
    const below = grid[dest+1][c];
    // 합성된 액체·고체(화합물) 위에만 쌓인다.
    // 빈칸·기체·낱개 원소는 그냥 통과해서 더 내려간다.
    if(below && !C[below].el && C[below].p !== 'gas') break;
    dest++;
  }
  if(dest === r) return pos;
  const id = grid[r][c], u = uids[r][c];
  for(let k=r; k<dest; k++){                          // 지나친 기체들은 한 칸씩 위로 밀린다
    grid[k][c] = grid[k+1][c];
    uids[k][c] = uids[k+1][c];
  }
  grid[dest][c]=id; uids[dest][c]=u;
  return [dest, c];
}
/* 생성 — 비어 있는 칸에 새 원소가 그 자리에서 들어온다 */
function fillHoles(){
  const fresh = new Set();
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!grid[r][c]){
    put(r, c, pickFor(r,c));
    fresh.add(uids[r][c]);
  }
  return fresh;
}
/* 합성물이 이동 뒤 어디로 갔는지 찾는다 */
function findUid(uid){
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(uids[r][c]===uid) return [r,c];
  return null;
}

/* ============ 합성 후보 ============ */
function candsFrom(r,c){
  const res=[];
  for(const [dr,dc] of DIRS){
    const comp = Object.assign({}, C[grid[r][c]].comp);
    const cells = [[r,c]];
    for(let k=1;k<N;k++){
      const nr=r+dr*k, nc=c+dc*k;
      if(nr<0||nc<0||nr>=N||nc>=N) break;
      const sub = C[grid[nr][nc]].comp;
      for(const e in sub) comp[e]=(comp[e]||0)+sub[e];
      cells.push([nr,nc]);
      const ck = ckey(comp);
      const prod = LOOKUP[ck];
      if(prod){ res.push({r:nr,c:nc,cells:cells.slice(),out:[prod]}); continue; }
      const rx = SPLIT[ck];                      // 가수분해·중화반응
      if(rx && rx.out.length<=cells.length) res.push({r:nr,c:nc,cells:cells.slice(),out:rx.out.slice(),rx:rx});
    }
  }
  return res;
}
function anyMove(){
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(candsFrom(r,c).length) return [r,c];
  return null;
}
function ensurePlayable(){
  let guard=0;
  while(!anyMove() && guard++<80){
    for(let r=0;r<N;r++) for(let c=0;c<N;c++) put(r,c, pickFor(r,c));
  }
}
/* 같은 물질이 붙어 있는 덩어리 */
function clusterAt(r,c){
  const id = grid[r][c], seen=new Set([r+','+c]), out=[[r,c]], q=[[r,c]];
  while(q.length){
    const [cr,cc]=q.shift();
    for(const [dr,dc] of DIRS){
      const nr=cr+dr, nc=cc+dc, k=nr+','+nc;
      if(nr<0||nc<0||nr>=N||nc>=N||seen.has(k)) continue;
      if(grid[nr][nc]!==id) continue;
      seen.add(k); out.push([nr,nc]); q.push([nr,nc]);
    }
  }
  return out;
}

/* ============ 렌더 ============ */
let tileEls = new Map();                       // uid → DOM
let cellEls = [];                              // 격자 칸 (좌표의 기준)
function buildCells(){
  boardEl.querySelectorAll('.cell').forEach(n=>n.remove());
  tileEls.forEach(el=>el.remove()); tileEls.clear();
  let layer = document.getElementById('tiles');
  if(layer) layer.remove();
  cellEls = [];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const d=document.createElement('div');
    d.className='cell';
    boardEl.appendChild(d);
    cellEls.push(d);
  }
  layer=document.createElement('div'); layer.id='tiles';
  boardEl.appendChild(layer);
}
/* 타일 좌표는 실제 격자 칸에서 직접 읽는다 (CSS를 바꿔도 어긋나지 않게) */
function cellPos(r,c){
  const el = cellEls[r*N+c];
  return el ? [el.offsetLeft, el.offsetTop] : [0,0];
}
/* 창 크기에 맞춰 칸 크기를 정한다 */
function fitBoard(){
  const W = window.innerWidth || 1280, H = window.innerHeight || 800;
  const side = 216 + 268 + 12*2 + 12*2;                    // 좌우 패널 + 여백
  const wAvail = W - side - 8;
  const hAvail = H - 44 - 24 - 30;                         // 헤더 · 여백 · 범례
  const cell = Math.max(40, Math.min(78, Math.floor(Math.min(wAvail, hAvail)/N) - 1));
  document.documentElement.style.setProperty('--cell', cell+'px');
}
window.addEventListener('resize', ()=>{ fitBoard(); render(); });
const STATE_CLS = ['anchor','cand','path','dim','react','bond','gone'];
function render(extra){
  const layer=document.getElementById('tiles');
  const pathSet=new Set();
  if(anchor) cands.forEach(cd=>cd.cells.forEach(([r,c])=>pathSet.add(r+','+c)));
  const alive=new Set();
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const id=grid[r][c]; if(!id) continue;
    const uid=uids[r][c]; alive.add(uid);
    const sp=C[id];
    let t=tileEls.get(uid);
    if(!t){                                    // 새로 생긴 타일
      t=document.createElement('div');
      t.className='tok popin';
      t.innerHTML='<i class="ph"></i><div class="f"></div><div class="n"></div>';
      const p0=cellPos(r,c);
      t.style.left=p0[0]+'px';
      t.style.top =p0[1]+'px';
      t.addEventListener('click', ()=> tap(+t.dataset.r, +t.dataset.c));
      t.addEventListener('animationend', ()=> t.classList.remove('popin'));
      layer.appendChild(t);
      tileEls.set(uid,t);
    }
    if(t.dataset.sp!==id){                     // 같은 자리에서 물질이 바뀐 경우
      t.dataset.sp=id;
      t.dataset.mol=sp.el?'':'1';
      t.style.setProperty('--phase','var(--'+sp.p+')');
      t.querySelector('.f').textContent=sp.f;
      t.querySelector('.n').textContent=sp.n;
    }
    t.dataset.r=r; t.dataset.c=c;
    const p=cellPos(r,c);
    t.style.left=p[0]+'px';
    t.style.top =p[1]+'px';
    STATE_CLS.forEach(k=>t.classList.remove(k));
    t.classList.toggle('mol', !sp.el);
    if(anchor){
      if(anchor[0]===r&&anchor[1]===c) t.classList.add('anchor');
      else if(cands.some(x=>x.r===r&&x.c===c)) t.classList.add('cand');
      else if(pathSet.has(r+','+c)) t.classList.add('path');
      else t.classList.add('dim');
    }
    if(extra && extra.cells.some(p=>p[0]===r&&p[1]===c)) t.classList.add(extra.cls);
  }
  tileEls.forEach((el,uid)=>{                  // 사라진 타일은 서서히 지운다
    if(alive.has(uid)) return;
    el.classList.add('gone');
    setTimeout(()=>el.remove(), 500);
    tileEls.delete(uid);
  });
}
function renderSide(){
  document.getElementById('score').textContent = score.toLocaleString();
  document.getElementById('best').textContent  = best.toLocaleString();
  document.getElementById('stageNo').textContent = (stage+1)+' / '+STAGES.length;
  const mv=document.getElementById('moves');
  mv.textContent = moves; mv.className = moves<=3?'warn':'';
  const g=STAGES[stage];
  document.getElementById('goalName').innerHTML =
    '+'+stageScore.toLocaleString()+' <small>/ '+g.target.toLocaleString()+'점</small>';
  document.getElementById('goalSub').innerHTML = '<b style="color:var(--text)">'+g.name+'</b><br>'+g.tip;
  document.getElementById('goalBar').style.width = Math.min(100, stageScore/g.target*100)+'%';
  document.getElementById('btnUndo').disabled = !undoState || busy;
  const info=document.getElementById('selInfo');
  if(!anchor) info.innerHTML='칸을 누르면 기준점이 되고,<br>거기서부터 이어서 누를 수 있는<br>칸이 금색으로 빛납니다.';
  else{
    const id=grid[anchor[0]][anchor[1]];
    info.innerHTML='<div style="font-size:15px;font-weight:800;color:var(--accent)">'+C[id].f+' '+C[id].n+'</div>'
      + '<div style="margin-top:7px">' + (cands.length
        ? '여기서 이어 만들 수 있는 지점 <b style="color:var(--gold)">'+cands.length+'</b>곳<br><span style="font-size:11px">무엇이 되는지는 만들어 봐야 압니다.</span>'
        : '이 칸에서 이어지는 조합이 없습니다.') + '</div>';
  }
}
function log(html, meta, win){
  const l=document.getElementById('log');
  const d=document.createElement('div');
  d.className='lg'+(win?' win':'');
  d.innerHTML='<div class="eq">'+html+'</div><div class="mt">'+meta+'</div>';
  l.prepend(d); while(l.children.length>18) l.lastChild.remove();
}
function floatMsg(t){
  const f=document.getElementById('float');
  f.innerHTML=t; f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
}

/* ============ 조작 ============ */
function tap(r,c){
  if(busy||!grid[r][c]) return;
  if(anchor){
    const cd=cands.find(x=>x.r===r&&x.c===c);
    if(cd){ react(cd); return; }
    if(anchor[0]===r&&anchor[1]===c){ anchor=null; cands=[]; render(); renderSide(); return; }
  }
  anchor=[r,c]; cands=candsFrom(r,c);
  render(); renderSide();
}
async function react(cd){
  busy=true; renderSide();
  pushUndo();
  const cells = cd.cells.slice();
  const outs  = cd.out.slice();
  const eq = cells.map(([r,c])=>C[grid[r][c]].f).join(' + ')+' → '+outs.map(id=>C[id].f).join(' + ');
  anchor=null; cands=[];

  /* ① 반응 — 고른 칸들이 빛난다 */
  render({cls:'react', cells:cells});
  await wait(750);

  /* ② 생성물 — 재료가 사라지고 그 자리에 새 물질이 나타난다
        (가수분해·중화반응은 한 번에 둘 이상이 나온다) */
  cells.forEach(([r,c])=> clear(r,c));
  const spots = cells.slice().reverse();               // 마지막에 누른 칸부터 채운다
  const prodUids = [];
  outs.forEach((id,i)=>{ const [r,c]=spots[i]; put(r,c,id); prodUids.push(uids[r][c]); });
  moves--;
  const freshOnes = [...new Set(outs.filter(id=>!found.has(id)))];
  freshOnes.forEach(id=>found.add(id));
  if(freshOnes.length){ try{ localStorage.setItem('chem-found3', JSON.stringify([...found])); }catch(e){} }
  render(); renderSide();
  if(cd.rx) floatMsg('<span style="font-size:20px;color:var(--accent)">'+cd.rx.t+'</span>');
  await wait(cd.rx ? 950 : 800);

  /* ③ 침강 — 만든 것이 액체·고체면 아래로 가라앉아 쌓인다 (기체는 제자리) */
  prodUids.forEach(u=>sink(u));
  render();
  await wait(800);

  /* ④ 증발 — 생성물마다, 같은 물질과 붙었으면 통째로 날아간다 */
  let total = 0; const notes = [];
  for(const u of prodUids){
    const at = findUid(u); if(!at) continue;
    const id = grid[at[0]][at[1]];
    const grp = clusterAt(at[0], at[1]);
    if(grp.length < 2) continue;
    const a = atoms(id);
    const bonus = 1 + Math.max(0, a-6)/10;            // 원자가 많은 분자일수록 배율이 붙는다
    const gain = Math.round(a * 40 * grp.length * grp.length * bonus);
    total += gain; score += gain; stageScore += gain;
    if(score>best){ best=score; try{ localStorage.setItem('chem-best3',best); }catch(e){} }
    notes.push(C[id].n+' '+grp.length+'개 증발 +'+gain.toLocaleString()+'점'
               + (bonus>1?' (원자 '+a+'개 ×'+bonus.toFixed(1)+')':''));
    render({cls:'bond', cells:grp});
    floatMsg('<span style="font-size:22px">'+C[id].f+' ×'+grp.length+' 증발</span><br>+'+gain.toLocaleString()
             + (bonus>1 ? '<br><span style="font-size:14px;color:var(--accent)">원자 '+a+'개 · 배율 ×'+bonus.toFixed(1)+'</span>' : ''));
    await wait(900);
    grp.forEach(([r,c])=> clear(r,c));
    render(); renderSide();
    await wait(600);
  }
  const tag = cd.rx ? cd.rx.t+' · '+cd.rx.d : null;
  if(total) log(eq, notes.join(' · ')+(tag?' · '+cd.rx.t:''), true);
  else{
    log(eq, tag || (freshOnes.length ? '새 물질 발견 · '+freshOnes.map(id=>C[id].n).join(', ')
                                     : outs.map(id=>C[id].n).join(' + ')+' 합성'), freshOnes.length>0);
    if(freshOnes.length && !cd.rx) floatMsg('<span style="font-size:22px">'+C[freshOnes[0]].f+'</span><br>새 물질');
    await wait(450);
  }

  /* ⑤ 생성 — 이동이 모두 끝난 뒤, 남은 빈칸에 새 원소가 들어온다 */
  fillHoles();
  render(); renderSide();
  await wait(650);

  busy=false;
  afterTurn();
}
function afterTurn(){
  if(stageScore>=STAGES[stage].target){ stageClear(); return; }
  if(moves<=0){ fail(); return; }
  if(!anyMove()){
    floatMsg('가능한 조합이 없어<br>판을 새로 깝니다');
    newBoard(); render();
    undoState = null;                          // 판이 바뀌면 되돌릴 수 없다
  }
  renderSide();
}

/* ============ 되돌리기 — 직전 한 수만 ============ */
function pushUndo(){
  undoState = {
    grid: grid.map(r=>r.slice()), uids: uids.map(r=>r.slice()),
    score: score, stageScore: stageScore, moves: moves
  };
}
function undo(){
  if(busy || !undoState) return;
  grid = undoState.grid.map(r=>r.slice());
  uids = undoState.uids.map(r=>r.slice());
  score = undoState.score; stageScore = undoState.stageScore; moves = undoState.moves;
  undoState = null;                            // 연속으로는 되돌릴 수 없다
  anchor=null; cands=[];
  render(); renderSide();
  log('되돌리기', '직전 한 수를 취소했습니다');
}

/* ============ 흐름 ============ */
function stageClear(){
  if(stage>=STAGES.length-1){
    modal('실험 완료','<div class="center"><h3>모든 스테이지 클리어</h3>'
      +'<p>원소 낱개에서 시작해 마지막 목표 점수까지 도달했습니다.</p>'
      +'<div class="big">'+score.toLocaleString()+'</div>'
      +'<p style="margin-top:16px">발견한 물질 '+found.size+' / '+Object.keys(C).length+'종</p>'
      +'<button onclick="init()">다시 시작</button></div>');
    return;
  }
  stage++;
  const g=STAGES[stage];

  modal('스테이지 '+(stage+1),
    '<div class="center"><h3>스테이지 클리어</h3><p>다음 실험대 · <b style="color:var(--text)">'+g.name+'</b></p>'
    + g.pool.map(id=>'<span class="unlock"><span class="f">'+C[id].f+'</span> '+C[id].n+'</span>').join('')
    + '<p style="margin-top:20px">목표 <b style="color:var(--gold)">'+g.target.toLocaleString()+'점</b> · 반응 '+g.mv+'회<br>'+g.tip+'</p>'
    + '<button onclick="nextStage()">계속</button></div>');
}
function nextStage(){ closeModal(); startStage(); }
function fail(){
  modal('반응 횟수 소진',
    '<div class="center"><h3>목표 점수에 닿지 못했습니다</h3>'
    +'<p>'+stageScore.toLocaleString()+' / '+STAGES[stage].target.toLocaleString()+'점</p>'
    +'<div class="big">'+score.toLocaleString()+'</div>'
    +'<button onclick="retry()" style="margin-top:14px">이 스테이지 다시</button> '
    +'<button onclick="init()">처음부터</button></div>');
}
function retry(){ closeModal(); score-=stageScore; startStage(); }

/* ============ 모달 / 버튼 ============ */

document.getElementById('btnHelp').onclick=()=>{
  modal('도움말',
   '<div style="line-height:1.95;font-size:13px">'
   +'<p><b>1.</b> 6×6 판이 원소로 가득 차 있습니다. 아무 칸이나 누르면 그 칸이 <b style="color:var(--accent)">기준점</b>이 됩니다.</p>'
   +'<p><b>2.</b> 기준점에서 가로·세로로 이어 눌렀을 때 원자 구성이 실제 물질과 맞아떨어지는 지점이 <b style="color:var(--gold)">금색으로 빛납니다.</b> 무엇이 만들어지는지는 알려주지 않습니다 — 화학식을 머릿속으로 세어 보세요.</p>'
   +'<p><b>3.</b> 어디까지 누르느냐로 결과가 달라집니다. <kbd>H</kbd> <kbd>H</kbd> <kbd>O</kbd> 가 이어져 있으면 가운데까지는 <b>H₂</b>, 끝까지 누르면 <b>H₂O</b>입니다.</p>'
   +'<p><b>4.</b> <b>만든 것만 움직입니다.</b> <span style="color:var(--liquid)">액체</span>·<span style="color:var(--solid)">고체</span>를 만들면 아래로 가라앉습니다. <b>낱개 원소는 그냥 지나쳐 내려가고, 이미 가라앉아 있는 분자를 만나면 그 위에 쌓입니다</b> — 그래서 바닥에는 분자로 된 퇴적층이 자랍니다. <span style="color:var(--gas)">기체</span>는 만든 자리에 그대로 있습니다. 침강이 끝난 뒤에 빈칸으로 새 원소가 들어옵니다.</p>'
   +'<p><b>5.</b> <b style="color:var(--gold)">점수는 합성 자체로는 들어오지 않습니다.</b> 만들어진 물질이 <b>같은 물질과 붙으면 그 덩어리가 통째로 증발하면서</b> 점수가 됩니다. 많이 모아서 한 번에 터뜨릴수록 점수가 급격히 커집니다.</p>'
   +'<p style="color:var(--dim)">점수 = 원자 수 × 40 × (증발한 개수)² × 대형 분자 배율<br>'
   +'H₂O 2개 = 480점 · 3개 = 1,080점 · 4개 = 1,920점<br>'
   +'원자가 6개를 넘으면 배율이 붙습니다 — 포도당(24개)은 ×2.8</p>'
   +'<p><b>7.</b> 스테이지가 오를수록 <b>반응 횟수가 늘고, 판에 분자가 미리 깔린 채로 시작</b>합니다. 깔린 분자에 원자를 이어 붙이면 혼자서는 못 만들 큰 분자에 닿습니다.</p>'
   +'<p><b>8.</b> 한 번에 <b>둘 이상이 나오는 반응</b>도 있습니다. 결과가 여러 개면 각각 따로 가라앉고, 각각 따로 뭉쳐 증발합니다.</p>'
   +'<p style="margin-left:14px"><b style="color:var(--accent)">가수분해</b> — 분자에 물을 이어 붙이면 둘로 갈라집니다.<br>'
   +'<span style="color:var(--dim)">CH₃COOC₂H₅ + H₂O → CH₃COOH + C₂H₅OH · Cl₂ + H₂O → HCl + HClO<br>'
   +'Na₂O + H₂O → NaOH + NaOH — 같은 것이 둘 나오니 그 자리에서 바로 증발합니다</span></p>'
   +'<p style="margin-left:14px"><b style="color:var(--accent)">중화반응</b> — 산과 염기를 이어 붙이면 염과 물이 됩니다.<br>'
   +'<span style="color:var(--dim)">HCl + NaOH → NaCl + H₂O · 2가 산은 염기가 둘 필요합니다:<br>'
   +'H₂SO₄ + NaOH + NaOH → Na₂SO₄ + H₂O + H₂O (물이 둘 생깁니다)</span></p>'
   +'<p><b>6.</b> <b>되돌리기</b>는 직전 한 수만 취소합니다 (<kbd>Ctrl</kbd>+<kbd>Z</kbd>). 연속으로는 되돌릴 수 없습니다.</p>'
   +'</div><div class="center"><button onclick="closeModal()">확인</button></div>');
};
document.getElementById('btnUndo').onclick = undo;
document.getElementById('btnRestart').onclick=()=>{ if(confirm('처음부터 다시 시작할까요?')) init(); };
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ anchor=null; cands=[]; render(); renderSide(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
});

init();
</script>
</body>
</html>
